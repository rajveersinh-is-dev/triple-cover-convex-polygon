[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triplecover"
version = "1.0.0"
description = "The triple-covering number of a convex n-gon: exact values, a sharp certificate lower bound, and verified constructions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "daveaddams91-dev" }]
keywords = [
    "combinatorial geometry",
    "convex polygon",
    "triangulation",
    "covering design",
    "set cover",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Repository = "https://github.com/daveaddams91-dev/triple-cover-convex-polygon"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"